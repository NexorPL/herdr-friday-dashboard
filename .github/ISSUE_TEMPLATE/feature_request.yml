name: Feature request
description: Suggest a change or a new widget
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Friday is built for its owner first, so scope stays small and the owner decides what fits. A clear problem helps more than a solution.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could Friday help? Say what it should not do as well.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today
      description: Workarounds or other tools you tried.
